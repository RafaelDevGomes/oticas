<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login · Ótica Lafaiete</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500&family=Poppins:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="./lafaiete.css">
</head>

<body>
  <!-- Fotos de fundo: Unsplash (licença livre) -->
  <div class="cenario" aria-hidden="true">
    <div class="cenario-loja"></div>
    <div class="cenario-pessoa"></div>
  </div>

  <main class="login">
    <section class="login-card">
      <div class="logo">
        <svg class="logo-oculos" viewBox="0 0 124 50" fill="none" stroke="currentColor" stroke-width="5" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 7h46c3 0 4.5 2 4 5l-3 18c-1.6 8-6 12-14 12H22c-8 0-12.5-4-14.5-12L3.5 12C3 9 3.5 7 5 7Z" />
          <path d="M119 7H73c-3 0-4.5 2-4 5l3 18c1.6 8 6 12 14 12h16c8 0 12.5-4 14.5-12l4-18c.5-3 0-5-1.5-5Z" />
          <path d="M55 12c4-3 10-3 14 0" />
        </svg>
        <span class="logo-texto">
          <small>Ótica</small>
          <strong>Lafaiete</strong>
        </span>
      </div>

      <h1 class="titulo">Bem-vindo(a)!</h1>
      <p class="subtitulo">Faça login para acessar o sistema.</p>

      <form class="form" action="#" method="post">
        <div class="campo">
          <label for="email">E-mail</label>
          <div class="input-wrap">
            <svg class="input-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="2" y="4" width="20" height="16" rx="2" />
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7" />
            </svg>
            <input id="email" name="email" type="email" placeholder="seu@email.com" autocomplete="email" required>
          </div>
        </div>

        <div class="campo">
          <label for="senha">Senha</label>
          <div class="input-wrap">
            <svg class="input-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="11" width="18" height="11" rx="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
            <input id="senha" name="senha" type="password" placeholder="Digite sua senha" autocomplete="current-password" required>
            <button type="button" class="toggle-senha" aria-label="Mostrar senha" aria-pressed="false">
              <svg class="icone-olho-fechado" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" />
                <path d="M6.61 6.61A13.53 13.53 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />
                <path d="M2 2l20 20" />
              </svg>
              <svg class="icone-olho" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primario">
          Entrar
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14" />
            <path d="m12 5 7 7-7 7" />
          </svg>
        </button>
      </form>

      <a href="#" class="link-esqueci">Esqueceu sua senha?</a>

      <div class="divisor"><span>ou</span></div>

      <a href="#" class="btn btn-contorno">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="8" r="5" />
          <path d="M20 21a8 8 0 0 0-16 0" />
        </svg>
        Acesso para representantes
      </a>
    </section>
  </main>

  <script>
    // Mostrar/ocultar senha
    const toggleSenha = document.querySelector('.toggle-senha');
    const campoSenha = document.getElementById('senha');

    toggleSenha.addEventListener('click', () => {
      const mostrar = campoSenha.type === 'password';
      campoSenha.type = mostrar ? 'text' : 'password';
      toggleSenha.setAttribute('aria-pressed', mostrar);
      toggleSenha.setAttribute('aria-label', mostrar ? 'Ocultar senha' : 'Mostrar senha');
    });
  </script>
</body>

</html>
